<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin kirish</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#fff;font-family:Arial,sans-serif}
.box{width:min(420px,90%);padding:32px;border-radius:20px;background:#101d30;box-shadow:0 20px 60px #0008;text-align:center}
input{width:100%;box-sizing:border-box;padding:14px;margin:16px 0;border-radius:10px;border:1px solid #38506d;background:#07111f;color:#fff}
button{width:100%;padding:14px;border:0;border-radius:10px;background:#18d9ff;color:#001018;font-weight:700;cursor:pointer}
.error{color:#ff6b6b;margin-bottom:12px}
a{color:#18d9ff}
</style>
</head>
<body>
<div class="box">
<h1>🔐 Admin panel</h1>
<p>Admin parolini kiriting</p>
{% if error %}<div class="error">{{ error }}</div>{% endif %}
<form method="post" action="/admin/login">
<input type="password" name="password" placeholder="Admin paroli" required>
<button type="submit">Kirish</button>
</form>
<p><a href="/">← Saytga qaytish</a></p>
</div>
</body>
</html>
